name: Release

# Changesets, not release-please (which the single-package sibling repo
# akhiakl/svgin-react uses) - see "Release tooling" in the setup plan for why
# this monorepo uses a different tool. changesets/action either opens/updates
# a "Version Packages" PR (when there are unreleased changesets) or publishes
# whatever changesets versioned in the last-merged such PR - both in one
# workflow run triggered by every push to main. Private packages
# (packages/core, apps/tryit) are skipped automatically.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # for npm provenance

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck typecheck:test test build size

      - name: Version or publish
        uses: changesets/action@v1
        with:
          publish: pnpm exec changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN for now; swap for OIDC trusted publishing (npm CLI
          # >=11.5.1, no token needed - see svgin-react's release.yml) once
          # this monorepo actually starts publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
