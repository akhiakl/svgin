name: Release

# Publishes to npm when a GitHub Release is published. release-please.yml
# opens a per-package "release please" PR that bumps package.json/CHANGELOG.md
# from Conventional Commits merged to main (manifest mode: only
# packages/react and packages/element are tracked - packages/core and
# apps/tryit stay private and are never released); merging that PR is what
# creates the GitHub Release (and tag) that triggers this workflow. Re-runs
# the quality gate (lint/typecheck/test/build) for the released package before
# publishing, so a release can never skip it - scoped with --filter to just
# that package's own workspace graph, not the whole repo (see the comment on
# the turbo step below).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Release tag to (re-)publish, e.g. svgin-react-v1.1.0. For retrying a
          release whose automatic publish failed: re-running the original
          failed run instead replays the *old* workflow file pinned to that
          tag's commit, missing any fix landed on main since (release-triggered
          runs source the workflow from the tag's ref, not main). Dispatching
          this from main picks up the current workflow logic while still
          checking out and publishing the tagged commit's package code.
        required: true
        type: string

permissions:
  contents: write # for the apps/tryit bump PR below, in addition to checkout
  pull-requests: write # to open/update that PR
  id-token: write # for npm provenance

jobs:
  publish:
    name: Build, verify, and publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Resolve the release tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Determine released package from the tag
        id: pkg
        run: |
          # release-please's manifest mode tags releases as
          # "<component>-vX.Y.Z" (e.g. svgin-react-v1.0.2, svgin-element-v0.1.0).
          TAG="${{ steps.tag.outputs.tag }}"
          case "$TAG" in
            svgin-react-v*) DIR="packages/react"; NAME="@svgin/react" ;;
            svgin-element-v*) DIR="packages/element"; NAME="@svgin/element" ;;
            *)
              echo "::error::Unrecognized release tag: $TAG"
              exit 1
              ;;
          esac
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: |
            .turbo
            packages/*/.turbo
            apps/*/.turbo
          # Same key namespace as ci.yml's build job: a release is triggered
          # off a commit that already went through the push-to-main CI run
          # (see the header comment above), so this is usually a real cache
          # hit reusing that run's build/lint/test outputs, not a cold start.
          key: turbo-build-${{ github.sha }}
          restore-keys: turbo-build-
      # --filter, not a repo-wide run: this only needs to verify the package
      # actually being published (svgin-core is its only workspace dependency,
      # via each package's own devDependencies + tsup noExternal - see the
      # svgin-monorepo skill). apps/tryit is deliberately excluded: it consumes
      # @svgin/react and @svgin/element as real npm dependencies, not workspace:*,
      # so it's not in this graph at all, and it is never released from this
      # workflow - gating a package release on an unrelated app's tests (or a
      # flake in them) blocks a real publish for no correctness benefit. See
      # https://github.com/akhiakl/svgin/actions/runs/35581884193 and
      # https://github.com/akhiakl/svgin/actions/runs/35581886165, where exactly
      # this happened: both releases failed pre-publish on an apps/tryit test
      # timeout unrelated to either published package.
      - run: pnpm turbo run lint typecheck typecheck:test test test:coverage build size --filter="${{ steps.pkg.outputs.name }}"

      - name: Verify package.json version matches the release tag
        id: verify
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          TAG_VERSION="${TAG##*-v}"
          PKG_VERSION=$(node -p "require('./${{ steps.pkg.outputs.dir }}/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag ($TAG) does not match ${{ steps.pkg.outputs.dir }}/package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        # Trusted publishing (OIDC) needs npm CLI >= 11.5.1, newer than what
        # ships with Node 22, and pnpm's own `publish` command does not speak
        # OIDC yet (https://github.com/pnpm/pnpm/issues/9812), so the actual
        # publish step uses `npm publish` directly instead of `pnpm publish`.
        # No NPM_TOKEN is needed: npm CLI auto-detects the GitHub Actions
        # OIDC token and exchanges it for a short-lived publish credential,
        # verified against the trusted publisher configured on npmjs.com for
        # this exact repo + workflow file.
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          npm install -g npm@^11.5.1
          npm publish --access public --provenance

      # From here on: open a PR bumping apps/tryit's dependency on the
      # package that was just published. This only runs after a real,
      # successful npm publish (not just a GitHub Release existing - see the
      # two runs linked in the turbo-filter comment above, where the release
      # existed but publish itself failed both times). Never auto-merged: CI
      # on the PR catches a breaking change (build/typecheck/test/e2e simply
      # fail), but nothing here can tell whether a new feature in the release
      # deserves a new demo route - that's still a human call, flagged in the
      # PR body's checklist line rather than silently skipped.
      - name: Checkout main for the apps/tryit bump
        uses: actions/checkout@v7
        with:
          ref: main
          path: tryit-bump

      - name: Extract this version's changelog entry
        id: changelog
        working-directory: tryit-bump
        env:
          VERSION: ${{ steps.verify.outputs.version }}
          DIR: ${{ steps.pkg.outputs.dir }}
        run: |
          VERSION_RE=$(printf '%s' "$VERSION" | sed 's/\./\\./g')
          START=$(grep -n "^## \[$VERSION_RE\]" "$DIR/CHANGELOG.md" | head -1 | cut -d: -f1)
          if [ -z "$START" ]; then
            echo "::warning::No CHANGELOG.md entry found for $VERSION in $DIR - PR body will skip it"
            echo "entry=" >> "$GITHUB_OUTPUT"
          else
            REST_LINES=$(tail -n "+$((START + 1))" "$DIR/CHANGELOG.md" | grep -n "^## \[" | head -1 | cut -d: -f1)
            if [ -n "$REST_LINES" ]; then
              END=$((START + REST_LINES - 1))
              ENTRY=$(sed -n "$((START + 1)),${END}p" "$DIR/CHANGELOG.md")
            else
              ENTRY=$(tail -n "+$((START + 1))" "$DIR/CHANGELOG.md")
            fi
            {
              echo "entry<<CHANGELOG_EOF"
              echo "$ENTRY"
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Bump apps/tryit's dependency
        id: bump
        working-directory: tryit-bump
        env:
          PKG_NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const path = 'apps/tryit/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.dependencies['$PKG_NAME'] = '^$VERSION';
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "
          corepack enable
          pnpm install --no-frozen-lockfile
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the bump PR
        if: steps.bump.outputs.changed == 'true'
        working-directory: tryit-bump
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_NAME: ${{ steps.pkg.outputs.name }}
          PKG_SHORT: ${{ steps.pkg.outputs.dir == 'packages/react' && 'react' || 'element' }}
          VERSION: ${{ steps.verify.outputs.version }}
          CHANGELOG_ENTRY: ${{ steps.changelog.outputs.entry }}
        run: |
          BRANCH="chore/bump-tryit-${PKG_SHORT}-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "chore(tryit): bump ${PKG_NAME} to ${VERSION}"
          git push --force-with-lease origin "$BRANCH"

          BODY_FILE=$(mktemp)
          {
            echo "Bumps \`${PKG_NAME}\` to \`${VERSION}\` in \`apps/tryit\`, opened automatically after that version published to npm."
            echo
            if [ -n "$CHANGELOG_ENTRY" ]; then
              echo "### What changed in ${PKG_NAME}@${VERSION}"
              echo "$CHANGELOG_ENTRY"
            fi
            echo
            echo "### Before merging"
            echo "- [ ] If this release added new public API or changed behavior, add or update a demo route that exercises it (see the \`svgin-monorepo\` skill's \`apps/tryit\` update rule) - CI passing here only means nothing broke, not that the demo actually shows the change."
          } > "$BODY_FILE"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --body-file "$BODY_FILE"
          else
            gh pr create --title "chore(tryit): bump ${PKG_NAME} to ${VERSION}" --body-file "$BODY_FILE" --base main --head "$BRANCH"
          fi
