name: CI

# Adapted from akhiakl/svgin-react's ci.yml for this Turborepo monorepo: every
# `pnpm run <task>` becomes `pnpm turbo run <task>` so Turborepo's caching and
# package graph apply. `scripts/check-bundle-size.mjs` (see the build job's
# "Check bundle size budget" step) is a generalized port of svgin-react's own
# script, reading each package's own size-budget.json instead of a hard-coded
# object - see #20. The pr-report job (scripts/pr-report.mjs, a sticky PR
# comment comparing head vs base) is likewise a generalized port of
# svgin-react's own job - one section per package instead of one, a unit
# test pass/fail summary the original didn't have, and (see #22) a
# per-browser E2E/axe-core accessibility summary for apps/tryit, parsed
# best-effort from the tryit-e2e job's own JSON reporter artifacts (needs:
# tryit-e2e, but runs even when that job is skipped - apps/tryit unchanged -
# via the explicit always()/result check on this job's own `if:`). The
# tryit-e2e job is ported from akhiakl/svgin-react-tryit's own ci.yml,
# scoped to apps/tryit via `pnpm --filter svgin-tryit` since it's the only
# workspace member with Playwright e2e tests.
#
# --affected on pull_request: only runs a task for packages that actually
# changed since the PR's base branch (plus anything that depends on them, via
# Turborepo's own package graph - correctly picks up e.g. a packages/core
# change also affecting packages/react/packages/element, unlike a plain
# path-based workflow trigger). Falls back to running everything if it can't
# compute the merge base (see the turborepo skill's ci/RULE.md), so this is
# safe, not just faster. Push to main always runs the full, unfiltered set as
# a safety net. fetch-depth: 0 on every checkout here is required for
# --affected to find the merge base at all.
#
# Turbo cache: every task-running job restores/saves each workspace's local
# `.turbo` directory via actions/cache, keyed per job (lint/typecheck/test/
# build each cache different task outputs) and per commit SHA, falling back
# to the closest previous cache for that job when the exact SHA isn't cached
# (a PR's first run, or a new commit on top of one already built). Turbo's
# own content hashing still decides real cache hits/misses inside that
# restored directory - this only avoids starting from a cold, empty `.turbo`
# on every single CI run. Deliberately the GitHub Actions cache API, not
# Vercel Remote Caching (no TURBO_TOKEN/TURBO_TEAM secret to provision) -
# see #24 if cross-fork or cross-repo sharing is ever needed, which this
# repo-scoped cache doesn't provide. Keys use the PR head SHA on
# pull_request events (`github.sha` there is the synthetic, ephemeral merge
# commit, which changes whenever the base branch moves - keying on it would
# throw away a cache on every base-branch update for no reason) and fall
# back to `github.sha` itself on push, where it already is the real commit.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            .turbo
            packages/*/.turbo
            apps/*/.turbo
          key: turbo-lint-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: turbo-lint-
      - run: pnpm turbo run lint ${{ github.event_name == 'pull_request' && '--affected' || '' }}

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            .turbo
            packages/*/.turbo
            apps/*/.turbo
          key: turbo-typecheck-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: turbo-typecheck-
      - run: pnpm turbo run typecheck ${{ github.event_name == 'pull_request' && '--affected' || '' }}
      - run: pnpm turbo run typecheck:test ${{ github.event_name == 'pull_request' && '--affected' || '' }}

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            .turbo
            packages/*/.turbo
            apps/*/.turbo
          key: turbo-test-node${{ matrix.node-version }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: turbo-test-node${{ matrix.node-version }}-
      - run: pnpm turbo run test ${{ github.event_name == 'pull_request' && '--affected' || '' }}

  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            .turbo
            packages/*/.turbo
            apps/*/.turbo
          key: turbo-coverage-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: turbo-coverage-
      # Separate from the `test` job above (which runs plain `vitest run`,
      # no coverage collection, on both Node versions): each package's own
      # coverage.thresholds (see svgin-vitest-config) are only evaluated
      # when coverage is actually collected, so a plain `turbo run test`
      # here would silently never enforce them. Node 22 only - coverage
      # correctness doesn't vary by Node version, and running it twice
      # would just double the cost for no signal.
      - run: pnpm turbo run test:coverage ${{ github.event_name == 'pull_request' && '--affected' || '' }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            .turbo
            packages/*/.turbo
            apps/*/.turbo
          key: turbo-build-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: turbo-build-
      - run: pnpm turbo run build ${{ github.event_name == 'pull_request' && '--affected' || '' }}
      - name: Check bundle size budget
        run: pnpm turbo run size ${{ github.event_name == 'pull_request' && '--affected' || '' }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod || echo "::warning::pnpm audit reported issues - review before releasing"

  tryit-changed:
    name: Check if apps/tryit changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        run: |
          if git diff --quiet ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- apps/tryit; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  tryit-e2e:
    name: apps/tryit E2E (${{ matrix.browser }})
    needs: [tryit-changed]
    # Always runs on push to main (safety net, same as the other jobs above);
    # on a PR, only when apps/tryit itself changed - it depends on the real
    # published svgin-react, not the workspace one, so a packages/react/core
    # change can never affect what this job actually exercises. svgin-element
    # is the one exception (still workspace:*, see #21/#19), which is why the
    # build step below exists at all - unlike svgin-react, there's no
    # published dist to install; packages/element's own dist has to be built
    # here first, or Next's build fails with "Can't resolve 'svgin-element'".
    if: github.event_name != 'pull_request' || needs.tryit-changed.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter svgin-element build
      - run: pnpm --filter svgin-tryit exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter svgin-tryit exec playwright test --project=${{ matrix.browser }}
        env:
          CI: true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tryit-playwright-report-${{ matrix.browser }}
          path: apps/tryit/playwright-report
          retention-days: 14

  pr-report:
    name: PR report (tests, coverage, size)
    needs: [tryit-changed, tryit-e2e]
    # needs: [..., tryit-e2e] so the E2E/a11y artifact download below can't
    # race its upload - but tryit-e2e's own `if:` skips it whenever
    # apps/tryit didn't change, and a skipped dependency makes a dependent
    # job skip too by default (its implicit condition is success(), which
    # does not count "skipped" as success) - always() plus an explicit
    # result check is the standard workaround for "run unless it actually
    # failed".
    if: >
      always() &&
      github.event_name == 'pull_request' &&
      (needs.tryit-e2e.result == 'success' || needs.tryit-e2e.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Both needed simultaneously, confirmed by GitHub's own 403 response
      # header (`x-accepted-github-permissions: issues=write;
      # pull_requests=write`) on a real run of this job after a previous fix
      # here mistakenly kept only issues: write, dropping pull-requests:
      # write entirely instead of adding issues: write alongside it - the
      # actual root cause of every prior "PR report can't post its comment"
      # investigation in this repo's history, not the repo-wide default
      # workflow permissions setting that got blamed at the time.
      issues: write
      pull-requests: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          path: head
      - name: Checkout PR base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: pnpm/action-setup@v6
        with:
          # PR head/base are checked out into head/ and base/ subdirectories
          # (not the workspace root), so pnpm/action-setup has no root
          # package.json to read the "packageManager" field from unless told
          # where to look.
          package_json_file: head/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            head/pnpm-lock.yaml
            base/pnpm-lock.yaml

      - name: Collect data from PR head
        working-directory: head
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build
          mkdir -p "$GITHUB_WORKSPACE/reports"
          declare -A DIRS=( [core]=packages/core [react]=packages/react [element]=packages/element [tryit]=apps/tryit )
          declare -A HAS_SIZE=( [react]=1 [element]=1 )
          for pkg in "${!DIRS[@]}"; do
            dir="${DIRS[$pkg]}"
            (cd "$dir" && pnpm exec vitest run --coverage --reporter=default --reporter=json --outputFile="$GITHUB_WORKSPACE/reports/head-test-$pkg.json") || true
            cp "$dir/coverage/coverage-summary.json" "$GITHUB_WORKSPACE/reports/head-coverage-$pkg.json" 2>/dev/null || true
            if [ "${HAS_SIZE[$pkg]:-}" = "1" ]; then
              (cd "$dir" && node ../../scripts/check-bundle-size.mjs --json --no-fail) > "$GITHUB_WORKSPACE/reports/head-size-$pkg.json" 2>/dev/null || true
            fi
          done

      # The base branch may be missing these scripts (predates this
      # tooling), have an older lockfile, or fail its own build entirely -
      # none of that should fail this PR's CI. Every step here is
      # best-effort; pr-report.mjs treats missing data as "n/a", not a
      # failure.
      - name: Collect data from PR base (best effort)
        working-directory: base
        continue-on-error: true
        run: |
          pnpm install --no-frozen-lockfile
          pnpm turbo run build
          declare -A DIRS=( [core]=packages/core [react]=packages/react [element]=packages/element [tryit]=apps/tryit )
          declare -A HAS_SIZE=( [react]=1 [element]=1 )
          for pkg in "${!DIRS[@]}"; do
            dir="${DIRS[$pkg]}"
            (cd "$dir" && pnpm exec vitest run --coverage --reporter=default --reporter=json --outputFile="$GITHUB_WORKSPACE/reports/base-test-$pkg.json") || true
            cp "$dir/coverage/coverage-summary.json" "$GITHUB_WORKSPACE/reports/base-coverage-$pkg.json" 2>/dev/null || true
            if [ "${HAS_SIZE[$pkg]:-}" = "1" ]; then
              (cd "$dir" && node ../../scripts/check-bundle-size.mjs --json --no-fail) > "$GITHUB_WORKSPACE/reports/base-size-$pkg.json" 2>/dev/null || true
            fi
          done

      - name: Download E2E/a11y results (best effort)
        # Entirely best-effort: no artifacts exist at all when tryit-e2e was
        # skipped (apps/tryit unchanged), and continue-on-error covers any
        # other download hiccup - pr-report.mjs already treats a missing
        # head-e2e-<browser>.json (see the next step) as "n/a", not a failure.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: tryit-playwright-report-*
          path: e2e-artifacts

      - name: Extract E2E/a11y JSON results (best effort)
        run: |
          for browser in chromium firefox webkit; do
            cp "e2e-artifacts/tryit-playwright-report-$browser/results.json" \
              "reports/head-e2e-$browser.json" 2>/dev/null || true
          done

      - name: Build report
        run: node head/scripts/pr-report.mjs reports > report.md

      - name: Post or update PR comment
        # On a PR from a fork, GITHUB_TOKEN is read-only and this step would
        # just fail; skip posting rather than failing the whole workflow.
        if: github.event.pull_request.head.repo.full_name == github.repository
        # continue-on-error kept as a defensive safety net now that the real
        # cause (missing pull-requests: write, see the permissions block
        # above) is fixed - if posting ever fails for some other reason
        # (rate limiting, a future permissions change, etc.), the report is
        # still generated and visible in this job's own logs either way.
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const marker = '<!-- svgin-pr-report -->';
            const fullBody = `${marker}\n${body}`;
            // github.paginate, not a single listComments call: that
            // defaults to page_size 30, so on a PR with more comments than
            // that, an existing sticky comment past page 1 would be missed
            // and a duplicate created instead of being updated.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }
