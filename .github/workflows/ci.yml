name: CI

# --affected on PRs runs only changed packages and their dependents (needs fetch-depth: 0).
# Push to main runs everything. The Turbo cache is keyed on the PR head SHA, because
# github.sha on a PR is an ephemeral merge commit. verify runs each check through
# akhiakl/ci-workflows; quality-gate and pr-report post sticky PR comments.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: |
            .turbo
            packages/*/.turbo
            apps/*/.turbo
          key: turbo-verify-node${{ matrix.node-version }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: turbo-verify-node${{ matrix.node-version }}-

      - uses: akhiakl/ci-workflows@v1
        id: lint
        continue-on-error: true
        with:
          name: lint
          run: pnpm turbo run lint ${{ github.event_name == 'pull_request' && '--affected' || '' }}

      - uses: akhiakl/ci-workflows@v1
        id: typecheck
        continue-on-error: true
        with:
          name: typecheck
          run: >-
            pnpm turbo run typecheck typecheck:test
            ${{ github.event_name == 'pull_request' && '--affected' || '' }}

      - uses: akhiakl/ci-workflows@v1
        id: test
        continue-on-error: true
        with:
          name: test
          run: pnpm turbo run test ${{ github.event_name == 'pull_request' && '--affected' || '' }}

      # Coverage only on Node 22; it doesn't vary by Node version.
      - uses: akhiakl/ci-workflows@v1
        if: matrix.node-version == 22
        id: coverage
        continue-on-error: true
        with:
          name: coverage
          run: pnpm turbo run test:coverage ${{ github.event_name == 'pull_request' && '--affected' || '' }}

      - uses: akhiakl/ci-workflows@v1
        id: build
        continue-on-error: true
        with:
          name: build
          run: >-
            pnpm turbo run build ${{ github.event_name == 'pull_request' && '--affected' || '' }} &&
            pnpm turbo run size ${{ github.event_name == 'pull_request' && '--affected' || '' }}

      - name: Upload check results
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ci-results-node-${{ matrix.node-version }}
          path: ci-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Fail if any check failed
        if: >-
          steps.lint.outcome == 'failure' || steps.typecheck.outcome == 'failure' ||
          steps.coverage.outcome == 'failure' || steps.test.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        run: exit 1

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  quality-gate:
    name: Quality Gate
    # always(): it exists to report failures.
    needs: [verify]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Both are required to post the sticky comment.
      issues: write
      pull-requests: write
    steps:
      - uses: akhiakl/ci-workflows/gate@v1
        with:
          marker: '<!-- svgin-quality-gate -->'
          title: Quality Gate
          status: |
            Lint, Typecheck, Test & Build (Node 22 & 24)=${{ needs.verify.result }}

      - name: Fail if verify failed
        if: needs.verify.result != 'success'
        run: exit 1

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod || echo "::warning::pnpm audit reported issues - review before releasing"

  tryit-changed:
    name: Check if apps/tryit changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        run: |
          if git diff --quiet ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- apps/tryit; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  tryit-e2e:
    name: apps/tryit E2E (${{ matrix.browser }})
    needs: [tryit-changed]
    # On a PR, only when apps/tryit changed: it uses the published packages, not the workspace ones.
    if: github.event_name != 'pull_request' || needs.tryit-changed.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @svgin/element build
      - run: pnpm --filter svgin-tryit exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter svgin-tryit exec playwright test --project=${{ matrix.browser }}
        env:
          CI: true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tryit-playwright-report-${{ matrix.browser }}
          path: apps/tryit/playwright-report
          retention-days: 14

  pr-report:
    name: PR report (tests, coverage, size)
    needs: [tryit-changed, tryit-e2e]
    # always() plus a result check: a skipped tryit-e2e must not skip this job.
    if: >
      always() &&
      github.event_name == 'pull_request' &&
      (needs.tryit-e2e.result == 'success' || needs.tryit-e2e.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Both are required to post the sticky comment.
      issues: write
      pull-requests: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          path: head
      - name: Checkout PR base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: pnpm/action-setup@v6
        with:
          # Head and base are checked out in subdirectories.
          package_json_file: head/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            head/pnpm-lock.yaml
            base/pnpm-lock.yaml

      - name: Collect data from PR head
        working-directory: head
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build
          mkdir -p "$GITHUB_WORKSPACE/reports"
          declare -A DIRS=( [core]=packages/core [react]=packages/react [element]=packages/element [tryit]=apps/tryit )
          declare -A HAS_SIZE=( [react]=1 [element]=1 )
          for pkg in "${!DIRS[@]}"; do
            dir="${DIRS[$pkg]}"
            (cd "$dir" && pnpm exec vitest run --coverage --reporter=default --reporter=json --outputFile="$GITHUB_WORKSPACE/reports/head-test-$pkg.json") || true
            cp "$dir/coverage/coverage-summary.json" "$GITHUB_WORKSPACE/reports/head-coverage-$pkg.json" 2>/dev/null || true
            if [ "${HAS_SIZE[$pkg]:-}" = "1" ]; then
              (cd "$dir" && node ../../scripts/check-bundle-size.mjs --json --no-fail) > "$GITHUB_WORKSPACE/reports/head-size-$pkg.json" 2>/dev/null || true
            fi
          done

      # Best-effort: the base may predate this tooling or fail to build; missing data shows as n/a.
      - name: Collect data from PR base (best effort)
        working-directory: base
        continue-on-error: true
        run: |
          pnpm install --no-frozen-lockfile
          pnpm turbo run build
          declare -A DIRS=( [core]=packages/core [react]=packages/react [element]=packages/element [tryit]=apps/tryit )
          declare -A HAS_SIZE=( [react]=1 [element]=1 )
          for pkg in "${!DIRS[@]}"; do
            dir="${DIRS[$pkg]}"
            (cd "$dir" && pnpm exec vitest run --coverage --reporter=default --reporter=json --outputFile="$GITHUB_WORKSPACE/reports/base-test-$pkg.json") || true
            cp "$dir/coverage/coverage-summary.json" "$GITHUB_WORKSPACE/reports/base-coverage-$pkg.json" 2>/dev/null || true
            if [ "${HAS_SIZE[$pkg]:-}" = "1" ]; then
              (cd "$dir" && node ../../scripts/check-bundle-size.mjs --json --no-fail) > "$GITHUB_WORKSPACE/reports/base-size-$pkg.json" 2>/dev/null || true
            fi
          done

      - name: Download E2E/a11y results (best effort)
        # Best-effort: no artifacts exist when tryit-e2e was skipped.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: tryit-playwright-report-*
          path: e2e-artifacts

      - name: Extract E2E/a11y JSON results (best effort)
        run: |
          for browser in chromium firefox webkit; do
            cp "e2e-artifacts/tryit-playwright-report-$browser/results.json" \
              "reports/head-e2e-$browser.json" 2>/dev/null || true
          done

      - name: Build report
        run: node head/scripts/pr-report.mjs reports > report.md

      - name: Post or update PR comment
        # On a PR from a fork, GITHUB_TOKEN is read-only and this step would
        # just fail; skip posting rather than failing the whole workflow.
        if: github.event.pull_request.head.repo.full_name == github.repository
        # So a posting failure never fails the workflow; the report is still in the logs.
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const marker = '<!-- svgin-pr-report -->';
            const fullBody = `${marker}\n${body}`;
            // github.paginate, not a single listComments call: that
            // defaults to page_size 30, so on a PR with more comments than
            // that, an existing sticky comment past page 1 would be missed
            // and a duplicate created instead of being updated.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }
